<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Vier NVV-Abfahrtsmonitore mit vergrößerbarer Ansicht.">
    <title>NVV · Vier Abfahrtsmonitore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/monitor.css">
</head>
<body>
    <main class="container-fluid monitor-dashboard" aria-label="Vier Abfahrtsmonitore">
        <div class="row monitor-grid">
            <section class="col-6 monitor-panel" aria-label="Monitor 1: Bf. Wilhelmshöhe (R)">
                <iframe title="Monitor 1: Bf. Wilhelmshöhe (R)" tabindex="-1" sandbox="allow-scripts allow-same-origin" src="https://auskunft.nvv.de/mct/views/monitor/?cfgFile=zY3dFQ94lrozxUbamGNv_1561622679541&amp;station=2200007&amp;productOrder=[4,1024]&amp;monitorHeadline=Bf.%20Wilhelmshöhe%20(R)"></iframe>
                <button class="monitor-open" type="button" data-bs-toggle="modal" data-bs-target="#monitorModal" aria-label="Bf. Wilhelmshöhe (R) vergrößern" aria-haspopup="dialog">
                    <span class="monitor-open-hint">Vergrößern &#8599;</span>
                </button>
            </section>
            <section class="col-6 monitor-panel" aria-label="Monitor 2: Annastr.">
                <iframe title="Monitor 2: Annastr." tabindex="-1" sandbox="allow-scripts allow-same-origin" src="https://auskunft.nvv.de/mct/views/monitor/?cfgFile=zY3dFQ94lrozxUbamGNv_1561622679541&amp;station=2200008&amp;productOrder=[]&amp;monitorHeadline=Annastr.%20(🚶5%20Min.)"></iframe>
                <button class="monitor-open" type="button" data-bs-toggle="modal" data-bs-target="#monitorModal" aria-label="Annastr. vergrößern" aria-haspopup="dialog">
                    <span class="monitor-open-hint">Vergrößern &#8599;</span>
                </button>
            </section>
            <section class="col-6 monitor-panel" aria-label="Monitor 3: Bismarckstr.">
                <iframe title="Monitor 3: Bismarckstr." tabindex="-1" sandbox="allow-scripts allow-same-origin" src="https://auskunft.nvv.de/mct/views/monitor/?cfgFile=zY3dFQ94lrozxUbamGNv_1561622679541&amp;station=2200255&amp;productOrder=[]&amp;monitorHeadline=Bismarckstr.%20(🚶10%20Min.)"></iframe>
                <button class="monitor-open" type="button" data-bs-toggle="modal" data-bs-target="#monitorModal" aria-label="Bismarckstr. vergrößern" aria-haspopup="dialog">
                    <span class="monitor-open-hint">Vergrößern &#8599;</span>
                </button>
            </section>
            <section class="col-6 monitor-panel" aria-label="Monitor 4: Murhardstr./Uni.">
                <iframe title="Monitor 4: Murhardstr./Uni." tabindex="-1" sandbox="allow-scripts allow-same-origin" src="https://auskunft.nvv.de/mct/views/monitor/?cfgFile=zY3dFQ94lrozxUbamGNv_1561622679541&amp;station=2200057&amp;productOrder=[]&amp;monitorHeadline=Murhardstr.%20(🚶8%20Min.)"></iframe>
                <button class="monitor-open" type="button" data-bs-toggle="modal" data-bs-target="#monitorModal" aria-label="Murhardstr./Uni. vergrößern" aria-haspopup="dialog">
                    <span class="monitor-open-hint">Vergrößern &#8599;</span>
                </button>
            </section>
        </div>
    </main>
    <div class="modal fade monitor-modal" id="monitorModal" tabindex="-1" aria-labelledby="monitorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="monitorModalLabel">Abfahrtsmonitor</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <iframe id="expandedMonitor" title="Vergrößerter Abfahrtsmonitor" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/monitor.js"></script>
</body>
</html>
